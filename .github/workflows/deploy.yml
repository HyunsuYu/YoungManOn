name: Deploy to GitHub Pages

on:
  # main 브랜치에 푸시될 때마다 자동 배포
  push:
    branches: [main]
  # 매일 00:00 UTC(한국시간 09:00)에 재빌드하여 최신 정책으로 갱신 (준실시간)
  schedule:
    - cron: "0 0 * * *"
  # Actions 탭에서 수동 실행도 허용
  workflow_dispatch:

# GitHub Pages 배포에 필요한 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 하나의 배포만 진행 (진행 중인 것은 취소)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (온통청년 API → 정적 JSON 생성 후 static export)
        run: npm run build
        env:
          # 레포 Settings > Secrets and variables > Actions 에 등록한 API 키.
          # 키가 없으면 generate 스크립트가 목업으로 폴백합니다.
          YOUTH_API_KEY: ${{ secrets.YOUTH_API_KEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # next.config.js 의 output:"export" 결과물 폴더
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
